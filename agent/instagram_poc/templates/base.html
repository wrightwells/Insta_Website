<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Instagram · Import lab</title><style>
:root{color-scheme:light;--ink:#192b33;--muted:#586970;--line:#d4dfe1;--accent:#146b60}*{box-sizing:border-box}body{margin:0;background:#f0f4f3;color:var(--ink);font:16px/1.55 system-ui,sans-serif}header{background:#192f35;color:white;padding:26px max(24px,calc((100vw - 1080px)/2))}header p{margin:4px 0;color:#bacfcd}main{max-width:1128px;margin:32px auto;padding:0 24px 60px}h1{font-size:28px;letter-spacing:-.8px;margin:0}h2{font-size:21px;margin:0 0 16px}h3{font-size:17px}p{margin:8px 0 16px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:12px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:26px;margin-bottom:24px}label{display:block;font-size:14px;font-weight:650;margin:16px 0 6px}input,select{width:100%;padding:11px 12px;border:1px solid #aabbbe;border-radius:7px;font:inherit;background:white}button,.button{display:inline-block;background:var(--accent);color:white;border:0;border-radius:7px;padding:11px 18px;font:600 14px system-ui;cursor:pointer;margin:16px 8px 0 0;text-decoration:none}button.secondary,.button.secondary{background:#e6efed;color:#194b43}.muted,small{color:var(--muted)}.notice{border-left:4px solid #146b60;background:#e0f0e8;padding:16px 20px;margin-bottom:24px}.notice.error{border-color:#a24632;background:#fff0e9}.badge{display:inline-block;font-size:12px;background:#e8eeed;padding:5px 10px;border-radius:20px}.caption{white-space:pre-wrap;overflow-wrap:anywhere}.post{border-top:1px solid var(--line);padding:22px 0}a{color:#146b60}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row form{margin-left:auto}.inline{display:inline}code{overflow-wrap:anywhere;font-size:13px}details{margin-top:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:#f1f5f4;padding:14px}.login{max-width:480px;margin:60px auto}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #e7a635;outline-offset:3px}@media(max-width:750px){.grid{grid-template-columns:1fr}.card{padding:20px}main{padding:0 16px}}
</style></head><body><header><div class="eyebrow">MySite / Operator tools</div><h1>Instagram import lab</h1><p>Connect an account. Inspect its content. Prepare the next import.</p></header><main>{% block body %}{% endblock %}</main></body></html>
