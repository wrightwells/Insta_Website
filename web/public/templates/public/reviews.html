{% extends 'public/base.html' %}
{% block content %}<section class="intro"><p class="eyebrow">{{ copy.reviews }}</p><h1>{{ copy.reviews_title }}</h1></section><div class="review-list">{% for review in reviews %}<figure class="review"><blockquote>{{ review.text|linebreaks }}</blockquote><figcaption>{{ review.record.reviewer_name }}{% if review.record.rating %} · <span aria-label="{{ copy.rating }}">{{ review.record.rating }}/5</span>{% endif %} · <time datetime="{{ review.record.published_at|date:'c' }}">{{ review.record.published_at|date:'DATE_FORMAT' }}</time></figcaption></figure>{% empty %}<div class="empty"><p>{{ copy.reviews_empty }}</p></div>{% endfor %}</div>{% endblock %}
